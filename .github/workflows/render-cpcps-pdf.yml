name: Render CPCPS PDF

on:
  workflow_call:
    inputs:
      build-artifact:
        description: Name of input artifact (defaults to CPCPS-document)
        type: string

      markdown-path:
        description: Path in the calling repo to a CPCPS markdown file (mutually exclusive with build-artifact)
        type: string

      markdown-file:
        description: Compiled markdown file name
        type: string
        default: CPCPS.md

    outputs:
      artifact-id:
        description: ID of artifact
        value: ${{ jobs.render.outputs.artifact-id }}

      artifact-url:
        description: URL of artifact
        value: ${{ jobs.render.outputs.artifact-url }}

jobs:
  render:
    runs-on: ubuntu-latest

    # pandoc + tex in this image
    # assets checkout out from pinned ref of this workflow
    container: pandoc/latex:3.10.0.0-ubuntu

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

    env:
      MARKDOWN_FILE: ${{ inputs.markdown-file }}

    steps:
      - name: Validate inputs
        env:
          BUILD_ARTIFACT: ${{ inputs.build-artifact }}
          MARKDOWN_PATH: ${{ inputs.markdown-path }}
        run: |
          if [ -n "$BUILD_ARTIFACT" ] && [ -n "$MARKDOWN_PATH" ]; then
            echo "::error::provide only one of build-artifact or markdown-path"
            exit 1
          fi

      - name: Install git # no certs by default
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout latex assets from this workflow's repo
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: render-assets

      - name: Checkout calling repo for markdown input
        if: inputs.markdown-path != ''
        uses: actions/checkout@v7
        with:
          path: render-input

      - name: Download input artifact
        if: inputs.markdown-path == ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.build-artifact || 'CPCPS-document' }}
          path: ${{ runner.temp }}/render/input

      - name: Install latex packages
        # geometry/fancyhdr/hyperref/xcolor/fontspec/graphicx are already in the pandoc/latex image (https://github.com/pandoc/dockerfiles/blob/main/common/latex/packages.txt)
        run: |
          tlmgr update --self
          tlmgr install tex-gyre \
                        caladea \
                        titlesec \
                        tocloft \
                        enumitem \
                        lastpage \
                        pdflscape \
                        parskip \
                        colortbl \
                        booktabs \
                        tools
          cp -v "$(kpsewhich -var-value TEXMFSYSVAR)/fonts/conf/texlive-fontconfig.conf" /etc/fonts/conf.d/09-texlive.conf
          fc-cache -f

      - name: Make pdf with pandoc + xelatex
        id: render # to grab the outputs
        env:
          MARKDOWN_PATH: ${{ inputs.markdown-path }}
        run: |
          ASSETS="$GITHUB_WORKSPACE/render-assets/.github/render-cpcps"
          if [ -n "$MARKDOWN_PATH" ]; then
            MD="$GITHUB_WORKSPACE/render-input/$MARKDOWN_PATH"
          else
            MD="$RUNNER_TEMP/render/input/$MARKDOWN_FILE"
          fi
          OUT_DIR="$RUNNER_TEMP/render/output"
          mkdir -p "$OUT_DIR"

          BASE="$(basename "$MD" .md)"
          echo "basename=${BASE}" >> "$GITHUB_OUTPUT"

          pandoc "$MD" \
            -f markdown+gfm_auto_identifiers \
            --standalone --syntax-highlighting=none \
            --lua-filter="$ASSETS/cpcps.lua" \
            --template="$ASSETS/cpcps.latex" \
            --pdf-engine=xelatex \
            --pdf-engine-opt=-interaction=nonstopmode \
            -o "$OUT_DIR/${BASE}.pdf"

      - name: Upload PDF artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('{0}-pdf', steps.render.outputs.basename) }} # uses basename from previous render step
          path: ${{ runner.temp }}/render/output/
